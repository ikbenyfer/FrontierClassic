name: Bouw Frontier Classic

on:
  push:
  workflow_dispatch:

env:
  SDL_VERSION: 2.0.22
  SDL_SHA256: fe7cbf3127882e3fc7259a75a0cb585620272c51745d3852ab9dd87960697f2e
  SDL_WIN_VERSION: 2.30.9
  SDL_WIN_SHA256: b188d165dc4a0372042bff3d0c18e9bb90772581e92a7b8b47b521b47714f75c

jobs:
  tests:
    name: Simulatie-tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compileren (gcc en clang, C++11, strenge waarschuwingen)
        run: |
          g++ -std=c++11 -O2 -Wall -Wextra -Werror src/core/*.cpp tests/sim_test.cpp -o sim_test
          clang++ -std=c++11 -O2 -Wall -Wextra -Werror src/core/*.cpp tests/sim_test.cpp -o sim_test_clang

      - name: Alle kaarten en spelmodi draaien (50 AI)
        run: ./sim_test Resources/maps 3000

      - name: Geheugencontrole (AddressSanitizer + UBSan)
        run: |
          g++ -std=c++11 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all src/core/*.cpp tests/sim_test.cpp -o sim_test_asan
          ./sim_test_asan Resources/maps 600

      - name: Multiplayer-test (host + 2 spelers via localhost)
        run: |
          g++ -std=c++11 -O2 -Wall -Wextra -Werror src/core/*.cpp src/net/*.cpp tests/net_test.cpp -pthread -o net_test
          ./net_test Resources/maps

      - name: Doorgeefserver bouwen en testen (spel via de server, verkeerde invoer)
        run: |
          g++ -std=c++11 -O2 -Wall -Wextra -Werror server/relay.cpp -o relay
          ./relay 47993 > relay.log 2>&1 &
          RELAY=$!
          sleep 1
          ./net_test Resources/maps relay 127.0.0.1 47993
          # rommel sturen: de server moet blijven draaien
          python3 - <<'PY'
          import os, socket, struct
          for n in range(40):
              s = socket.create_connection(("127.0.0.1", 47993), timeout=3)
              junk = [os.urandom(2000), b"GET / HTTP/1.1\r\n\r\n", struct.pack("<IB", 0xFFFFFFFF, 100),
                      struct.pack("<IB", 300, 101) + b"x" * 5, struct.pack("<IBI", 5, 102, 12345), b""][n % 6]
              try:
                  s.sendall(junk)
              except OSError:
                  pass
              s.close()
          print("junk sent")
          PY
          ./net_test Resources/maps relay 127.0.0.1 47993 | tail -3
          echo "== geheugen van de server na twee potjes en 40 rommelverbindingen"
          grep -E "VmRSS|VmHWM" /proc/$RELAY/status
          kill -TERM $RELAY
          wait $RELAY || true
          tail -4 relay.log

      - name: Doorgeefserver met geheugencontrole (AddressSanitizer + UBSan)
        run: |
          g++ -std=c++11 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all server/relay.cpp -o relay_asan
          ./relay_asan 47994 > relay_asan.log 2>&1 &
          RELAY=$!
          sleep 1
          ./net_test Resources/maps relay 127.0.0.1 47994 | tail -3
          kill -TERM $RELAY
          wait $RELAY
          cat relay_asan.log | tail -3

      - name: Multiplayer-test met geheugencontrole
        run: |
          g++ -std=c++11 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all src/core/*.cpp src/net/*.cpp tests/net_test.cpp -pthread -o net_test_asan
          ./net_test_asan Resources/maps

  screenshots:
    name: Schermafbeeldingen (Linux, OpenGL ES 2.0 via Mesa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pakketten
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libgles-dev libegl-dev libgl1-mesa-dri xvfb imagemagick

      - name: Desktopversie bouwen
        run: |
          g++ -std=c++11 -O2 -Wall -Wextra src/core/*.cpp src/net/*.cpp src/app/*.cpp $(sdl2-config --cflags) \
            $(sdl2-config --libs) -lGLESv2 -o frontier_desktop

      - name: Spel automatisch spelen en fotograferen
        env:
          SDL_VIDEO_X11_FORCE_EGL: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p shots
          xvfb-run -a -s "-screen 0 1024x768x24" ./frontier_desktop --shots shots | tee shots.log
          grep "MP:" shots.log
          grep -q "tiles different between host and client: 0," shots.log
          for f in shots/*.bmp; do convert "$f" "${f%.bmp}.png" && rm "$f"; done
          ls -l shots
          test "$(ls shots/*.png | wc -l)" -ge 24

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.png

  server:
    name: Doorgeefserver als Docker-container
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image bouwen met docker compose (zoals op de NAS)
        working-directory: server
        run: |
          docker compose build
          docker image ls frontier-relay
          docker compose up -d
          sleep 2
          docker compose ps
          docker compose logs

      - name: Een spel spelen via de container
        run: |
          g++ -std=c++11 -O2 src/core/*.cpp src/net/*.cpp tests/net_test.cpp -pthread -o net_test
          ./net_test Resources/maps relay 127.0.0.1 47800

      - name: Geheugen en grootte
        working-directory: server
        run: |
          echo "== geheugen van de container (na een spel met 3 spelers)"
          docker stats --no-stream --format "{{.Name}}: {{.MemUsage}}  cpu {{.CPUPerc}}" frontier-relay
          echo "== grootte van de image"
          docker image ls frontier-relay --format "{{.Repository}}: {{.Size}}"
          docker compose logs | tail -8
          echo "== stoppen"
          time docker compose down

      - name: Servermap als download
        run: |
          mkdir -p out/FrontierClassic-server
          cp server/relay.cpp server/Dockerfile server/docker-compose.yml server/LEESMIJ.md out/FrontierClassic-server/
          (cd out && zip -qr FrontierClassic-server.zip FrontierClassic-server)

      - uses: actions/upload-artifact@v4
        with:
          name: FrontierClassic-server
          path: out/FrontierClassic-server.zip

  windows:
    name: Windows-versie bouwen (64-bit)
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: MinGW-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip

      - name: SDL ${{ env.SDL_WIN_VERSION }} voor Windows (gecontroleerd met SHA-256)
        run: |
          curl -fsSL -o sdl-mingw.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-$SDL_WIN_VERSION/SDL2-devel-$SDL_WIN_VERSION-mingw.tar.gz"
          echo "$SDL_WIN_SHA256  sdl-mingw.tar.gz" | sha256sum -c -
          tar xzf sdl-mingw.tar.gz

      - name: Bouwen (alles in een .exe, geen losse DLL's)
        run: |
          SDL="SDL2-$SDL_WIN_VERSION/x86_64-w64-mingw32"
          x86_64-w64-mingw32-windres windows/app.rc -O coff -o app_res.o
          x86_64-w64-mingw32-g++ -std=c++11 -O2 -Wall -Wextra -DUNICODE -D_UNICODE \
            src/core/*.cpp src/net/*.cpp src/app/*.cpp app_res.o \
            -I"$SDL/include/SDL2" -L"$SDL/lib" \
            -static -lmingw32 -mwindows -lSDL2main -lSDL2 \
            -lopengl32 -lgdiplus -lcomdlg32 -lws2_32 -liphlpapi \
            -lm -lkernel32 -luser32 -lgdi32 -lwinmm -limm32 -lole32 -loleaut32 -lversion -luuid -ladvapi32 -lsetupapi -lshell32 -ldinput8 \
            -o FrontierClassic.exe
          file FrontierClassic.exe
          x86_64-w64-mingw32-objdump -p FrontierClassic.exe | grep "DLL Name" | sort

      - name: Zip maken
        run: |
          VERSION=$(grep '^Version:' control | awk '{print $2}')
          D="FrontierClassic-Windows"
          mkdir -p "$D/Resources"
          cp FrontierClassic.exe "$D/"
          cp -R Resources/maps Resources/font Resources/music "$D/Resources/"
          cp windows/LEESMIJ.txt "$D/"
          zip -qr "FrontierClassic-Windows-$VERSION.zip" "$D"
          ls -l *.zip
          unzip -l "FrontierClassic-Windows-$VERSION.zip" | tail -3

      - uses: actions/upload-artifact@v4
        with:
          name: FrontierClassic-Windows
          path: FrontierClassic-Windows-*.zip

  ios:
    name: iPad-app bouwen (iOS 9.3, armv7)
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      THEOS: ${{ github.workspace }}/theos
      SDK_NAME: iPhoneOS14.5
    steps:
      - uses: actions/checkout@v4
        with:
          path: project

      - name: Linux-pakketten
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip unzip git file
          # package names differ between Ubuntu versions
          sudo apt-get install -y libxml2 || sudo apt-get install -y libxml2-16
          sudo apt-get install -y libtinfo6 || true

      - name: Theos
        run: git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"

      - name: iOS-toolchain (compiler en linker)
        run: |
          mkdir -p "$THEOS/toolchain"
          curl -fsSL "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz" \
            | tar -xJf - -C "$THEOS/toolchain/"
          ls "$THEOS/toolchain/linux/iphone/bin"

      - name: ldid (nep-ondertekening)
        run: |
          TC="$THEOS/toolchain/linux/iphone/bin"
          if command -v ldid >/dev/null 2>&1; then echo "ldid: $(command -v ldid)"
          elif [ -x "$TC/ldid" ]; then sudo ln -sf "$TC/ldid" /usr/local/bin/ldid
          else
            sudo curl -fsSL -o /usr/local/bin/ldid "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64"
            sudo chmod +x /usr/local/bin/ldid
          fi

      - name: iOS ${{ env.SDK_NAME }} SDK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "$THEOS/bin/install-sdk" "$SDK_NAME"
          rm -rf "$THEOS/sdks/$SDK_NAME.sdk/System/Library/PrivateFrameworks/WebKit.framework"

      - name: SDL ${{ env.SDL_VERSION }} (broncode, gecontroleerd met SHA-256)
        working-directory: project
        run: |
          curl -fsSL -o sdl.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-$SDL_VERSION/SDL2-$SDL_VERSION.tar.gz"
          echo "$SDL_SHA256  sdl.tar.gz" | sha256sum -c -
          mkdir -p third_party
          tar xzf sdl.tar.gz -C third_party
          mv "third_party/SDL2-$SDL_VERSION" third_party/SDL2
          cat ios/SDL_config_overrides.h >> third_party/SDL2/include/SDL_config_iphoneos.h
          tail -5 third_party/SDL2/include/SDL_config_iphoneos.h

      - name: App bouwen
        working-directory: project
        run: make -k -j4 clean package FINALPACKAGE=1 messages=no

      - name: Controleren (armv7, iOS 9.3, geen netwerk)
        working-directory: project
        run: |
          set -e
          APP=".theos/_/Applications/FrontierClassic.app"
          BIN="$APP/FrontierClassic"
          TC="$THEOS/toolchain/linux/iphone/bin"
          echo "== architectuur"
          file "$BIN"
          ARCH="$("$TC/lipo" -info "$BIN")"
          echo "$ARCH"
          echo "$ARCH" | grep -q "armv7" || { echo "::error::geen armv7"; exit 1; }
          if echo "$ARCH" | grep -q "arm64"; then echo "::error::onverwacht arm64"; exit 1; fi
          echo "== minimale iOS-versie"
          "$TC/otool" -l "$BIN" | grep -A4 -E "LC_VERSION_MIN_IPHONEOS|LC_BUILD_VERSION" | tee minver.txt
          grep -qE "version 9\.3|minos 9\.3" minver.txt || { echo "::error::minimale iOS-versie is niet 9.3"; exit 1; }
          echo "== gekoppelde frameworks"
          "$TC/otool" -L "$BIN" | tee libs.txt
          if grep -qiE "CFNetwork|Network.framework|WebKit|SystemConfiguration|libnetwork|Security.framework" libs.txt; then
            echo "::error::netwerk- of webframework gevonden"; exit 1
          fi
          echo "== netwerk: alleen kale sockets voor multiplayer, geen web/HTTP/tracking"
          "$TC/nm" -u "$BIN" > undef.txt || true
          if grep -E "NSURLSession|NSURLConnection|CFStream|CFSocket|CFHTTP|WKWebView|UIWebView|SCNetworkReachability" undef.txt; then
            echo "::error::web- of HTTP-functies gevonden"; exit 1
          fi
          grep -E "^ *_(socket|connect|bind|listen|accept|getaddrinfo)$" undef.txt | sort | tr '\n' ' '
          grep -qE "^ *_socket$" undef.txt || { echo "::error::multiplayer-sockets ontbreken"; exit 1; }
          echo
          echo "ok: alleen sockets (multiplayer)"
          echo "== Info.plist"
          grep -A1 -E "MinimumOSVersion|CFBundleIdentifier" "$APP/Info.plist"
          grep -q "UIInterfaceOrientationPortrait" "$APP/Info.plist" && { echo "::error::portrait staat aan"; exit 1; } || true
          echo "== bestanden"
          test -f "$APP/maps/index.json" && test -f "$APP/maps/world.bin" && test -f "$APP/font/font.bin"
          test -f "$APP/Icon-76.png" && test -f "$APP/Default-Landscape~ipad.png"
          test -f "$APP/music/holding_the_ridge.mp3"
          grep -q NSPhotoLibraryUsageDescription "$APP/Info.plist"
          ls "$APP" "$APP/maps"
          du -sh "$APP"

      - name: IPA maken en controleren
        working-directory: project
        run: |
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R ".theos/_/Applications/FrontierClassic.app" ipa/Payload/
          (cd ipa && zip -qr ../packages/FrontierClassic.ipa Payload)
          unzip -l packages/FrontierClassic.ipa | grep -E "Payload/FrontierClassic.app/(FrontierClassic|Info.plist|maps/world.bin)$"
          ls -l packages

      - uses: actions/upload-artifact@v4
        with:
          name: FrontierClassic
          path: |
            project/packages/*.ipa
            project/packages/*.deb

      - name: Release op GitHub (iPad-bestanden)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: project
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(grep '^Version:' control | awk '{print $2}')
          TAG="v$VERSION"
          cp packages/FrontierClassic.ipa "packages/FrontierClassic-$VERSION.ipa"
          DEB=$(ls packages/*.deb | head -1)
          printf 'Frontier Classic %s. iPad 2 (iOS 9.3.5, armv7) en Windows (64-bit). Singleplayer is volledig offline; internet is alleen nodig voor multiplayer.\n\niPad: installeer de .ipa met iPad IPA Installer (USB) of Filza, met AppSync Unified.\nWindows: pak de zip uit en start FrontierClassic.exe.\n' "$VERSION" > notes.md
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Frontier Classic $VERSION" --notes-file notes.md --target "$GITHUB_SHA" --latest || true
          gh release upload "$TAG" "packages/FrontierClassic-$VERSION.ipa" "$DEB" --clobber

  release-windows:
    name: Windows-zip bij de release zetten
    needs: [windows, ios]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FrontierClassic-Windows
      - name: Uploaden
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(grep '^Version:' control | awk '{print $2}')
          gh release upload "v$VERSION" FrontierClassic-Windows-*.zip --clobber
