# Frontier Classic relay server
#   start / update:  docker compose up -d --build
#   logs:            docker compose logs -f
#   stop:            docker compose down
services:
  frontier-relay:
    build: .
    image: frontier-relay:latest
    container_name: frontier-relay
    restart: unless-stopped
    ports:
      - "47800:47800/tcp"     # left side = port on the NAS; forward this TCP port in your router to the NAS
    mem_limit: 64m            # it normally uses only a few MB
    cpus: 0.5
    read_only: true           # the server writes nothing to disk
    # no cap_drop / security_opt: Portainer refuses those for non-admin users, and they add
    # nothing here: the server already runs as user "nobody" in an empty image (see Dockerfile)
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
